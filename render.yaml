services:
  - type: web
    name: orcamento-clamed
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: HOME
        value: /tmp
      - key: SAL_USE_VCLPLUGIN
        value: svp
      - key: DB_PATH
        value: /var/data/orcamentos.db
      - key: APP_ADMIN_USER
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: ORCAMENTOS_OUTPUT_DIR
        value: /var/data/saida
      - key: TEMPERATURE_MAP_OUTPUT_DIR
        value: /var/data/saida/mapas_temperatura
      - key: EXPORT_PATH
        value: /var/data/orcamentos_export.csv
    disk:
      name: orcamento-data
      mountPath: /var/data
      sizeGB: 1
